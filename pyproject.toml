[project]
name = "aa-case-02-oil-price-prediction"
version = "0.1.0"
description = "Educational machine learning case study on oil price prediction using RNN, LSTM, and GRU, including data collection and supporting resources."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "yfinance (>=1.8.0,<2.0.0)",
    "torch (>=2.15.0,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "tabulate (>=0.10.0,<0.11.0)",
    "tensorboard (>=2.21.0,<3.0.0)",
    "huggingface-hub (>=0.30,<2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false

# torch se instala desde el índice CPU de PyTorch (~200 MB) en lugar del de PyPI, que en
# Linux arrastra las librerías CUDA (>2 GB). Es la rueda que usa GitHub Actions.
[tool.poetry.dependencies]
torch = { source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

# Notebook de análisis exploratorio (opcional; la Action no lo instala):
#   poetry install --with notebooks
[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
ipykernel = "^7.4.0"
nbformat = "^5.11.1"
nbclient = "^0.11.0"
